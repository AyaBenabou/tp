<!DOCTYPE html>
<html>
  <head>
    <title>Daily planner</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
  </head>

  <h3>CHIMAAA hmara </h3>
  <body class="body">
    <header>
      <h1 class="tit">Daily Planner 🎀</h1>
    </header>
    <div class="top-row">
       <div id="weather">
      <h4>Weather:</h4>
      </div>
    <div class="date-b">
    <span>Date :</span>
    <input class="date" type="date" >
    </div>
    
    <div id="mood">
      <h4>Mood:</h4>
    </div>
    </div>

    <div class="tdl">
    <h2>To-Do List</h2>
    <input class="cont" type="text" id="task-input" name="task" placeholder="Enter a task">
    <button id="add-btn">Add</button>
    <ul id="task-list">
    </ul></div>
    <div class="A">
    <div class="sport">
    <h4>Exercice :</h4>
   <div class="input-box">
  <span>Workout :</span>
  <input id="workout" type="text" name="workout">
</div>

<div class="input-box">
  <span>Total Minutes :</span>
  <input id="Total-min" type="number" name="tot-min" value="0">
</div>

<div class="input-box">
  <span>Total Steps :</span>
  <input id="tot-steps" type="text" name="tot-steps">
</div>
<img src="images/sports.jpg">
</div>
<div class="notes">
  <span>🎀Notes🎀</span>
  <textarea name="notes" placeholder="Enter your notes here..."></textarea>
</div>
<div class ="tmrw">
  <span>🎀For tomorrow🎀</span>
  <text name="tmrw"></text>
</div>
<div class="meals">
  <h4>Meal tracker</h4>
  <div class="meal-row">
  <div class="input-cont">
    <span>Breakfast</span>
   <input id="Breakfast" type="text" name="breakfast">
   </div>
   <div class="input-cont">
    <span>Lunch</span>
   <input id="Lunch" type="text" name="lunch">
   </div>
   </div>
    <div class="meal-row">
   <div class="input-cont">
    <span>Dinner</span>
   <input id="Dinner" type="text" name="dinner">
   </div>
   <div class="input-cont">
    <span>Snack</span>
   <input id="Snack" type="text" name="snack">
   </div>
   </div>
   </div>
</div>
     <script src="script.js"></script>
  </body>
 
</html>
